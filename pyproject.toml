[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "replicable-sports-engine"
version = "2.0.0"
description = "Competition engine with leakage-safe temporal reconstruction for the FIFA World Cup 2026"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
legacy-ml = ["torch>=2.2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
sports-engine = "sports_engine.cli:main"
worldcup-brain = "worldcup_brain.cli:main"
