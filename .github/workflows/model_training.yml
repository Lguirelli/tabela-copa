name: Model training and recalibration

on:
  workflow_run:
    workflows: ["Post-match analytical update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      competition:
        description: Competition ID from config/competitions.yaml, or all
        required: false
        default: all
  push:
    paths:
      - "config/competitions.yaml"

permissions:
  contents: write

concurrency:
  group: repository-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run evidence checks, recalibration and simulation
        env:
          COMPETITION: ${{ inputs.competition || 'all' }}
        run: |
          if [ "$COMPETITION" = "all" ]; then
            python -m sports_engine.cli run-registry
          else
            python -m sports_engine.cli run-all --competition "$COMPETITION"
          fi
      - name: Export World Cup model dashboard
        run: python scripts/export_model_dashboard.py
      - name: Validate trained artifacts
        env:
          COMPETITION: ${{ inputs.competition || 'all' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider
          PYTHONDONTWRITEBYTECODE=1 python scripts/validate_repository.py
          if [ "$COMPETITION" = "all" ] || [ "$COMPETITION" = "world_cup_2026" ]; then
            python scripts/testes/test_integridade_dados.py
          fi
      - name: Commit versioned model outputs
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data logs models reports src/model-analytics-data.js; do
            [ -e "$path" ] && git add -A "$path"
          done
          git commit -m "chore(model): retrain and recalibrate"
          git push
