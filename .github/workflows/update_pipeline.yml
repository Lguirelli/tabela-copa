        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "PIPELINE_MODE=${INPUT_MODE:-daily}" >> "$GITHUB_ENV"
            echo "COMPETITION=${INPUT_COMPETITION:-all}" >> "$GITHUB_ENV"
            echo "AS_OF=${INPUT_AS_OF:-}" >> "$GITHUB_ENV"
            echo "ALLOW_NETWORK=${INPUT_ALLOW_NETWORK:-true}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "PIPELINE_MODE=post-match" >> "$GITHUB_ENV"
            echo "COMPETITION=all" >> "$GITHUB_ENV"
            echo "AS_OF=" >> "$GITHUB_ENV"
            echo "ALLOW_NETWORK=true" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_MODE=daily" >> "$GITHUB_ENV"
            echo "COMPETITION=all" >> "$GITHUB_ENV"
            echo "AS_OF=" >> "$GITHUB_ENV"
            echo "ALLOW_NETWORK=true" >> "$GITHUB_ENV"
          fi
      - name: Run canonical pipeline once
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$PIPELINE_MODE" --competition "$COMPETITION" --run-tests)
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          if [ "$ALLOW_NETWORK" = "true" ]; then args+=(--allow-network); fi
          python scripts/run_repository_pipeline.py "${args[@]}"
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-pipeline-${{ github.run_id }}
          path: |
            logs/pipeline
            reports/pipeline
          if-no-files-found: warn
          retention-days: 14
      - name: Commit generated artifacts once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data models predictions learning simulations reports src/model-analytics-data.js; do
            [ -e "$path" ] && git add -A "$path"
          done
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore(pipeline): ${PIPELINE_MODE} update [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 3))
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
