name: Repository quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "sports_engine/**"
      - "worldcup_brain/**"
      - "scripts/**"
      - "tests/**"
      - "legacy/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "Makefile"
      - "data/entrada/**"
      - "data/matches.csv"
      - "data/resultados_reais.csv"
      - "data/platform/**"
      - "data/normalized/**"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  SPORTS_ENGINE_NETWORK: "0"

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
